name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Build release AAB (unsigned)
        run: gradle :app:bundleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransportLogPro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransportLogPro-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Publish latest APK for direct mobile download
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/TransportLogPro-latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/TransportLogPro-latest.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish latest Android APK [skip ci]"
            git push
          fi
