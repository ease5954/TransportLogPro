name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify QR and registration flows
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/qr-ssangyong-fix.js
          node --check app/src/main/assets/qr-sampyo-ui-fix.js
          node --check app/src/main/assets/manual-quick-register-fix.js
          node --check app/src/main/assets/transport-edit-fix.js
          node --check app/src/main/assets/quick-register-calc-loading-fix.js
          node tests/qr-waybill.test.cjs
          node tests/qr-ssangyong-fix.test.cjs
          node tests/qr-hanil-final.test.cjs
          node tests/qr-halla-port.test.cjs
          node tests/qr-spnature.test.cjs
          node tests/qr-sampyo-samcheok-current.test.cjs
          node tests/qr-sampyo-ui-fix.test.cjs
          node tests/client-registration.test.cjs
          node tests/quick-transport-save.test.cjs
          node tests/manual-quick-register.test.cjs
          node tests/direct-client-entry.test.cjs
          node tests/manual-product-entry.test.cjs
          node tests/transport-edit.test.cjs
          node tests/freight-loading.test.cjs
          node tests/first-save-integrity.test.cjs

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Build release AAB (unsigned)
        run: gradle :app:bundleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransportLogPro-HANIL-HD-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransportLogPro-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Publish latest TEST APK and ZIP
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/TransportLogPro-HANIL-HD.apk
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          apk = Path("downloads/TransportLogPro-HANIL-HD.apk")
          message = (
              "운송일보 PRO QR 테스트 앱 (1.9.2)\n"
              "1. 최신 Android의 Predictive Back을 끄고 앱의 뒤로가기 로직을 우선 사용합니다.\n"
              "2. 등록/내역/정산 등 하위 화면에서 뒤로가기를 누르면 홈으로 이동합니다.\n"
              "3. 홈에서는 뒤로가기를 한 번 누르면 종료 안내가 나오고, 2초 안에 한 번 더 누르면 종료됩니다.\n"
              "4. 열린 메뉴/보험/앱정보/단가 팝업은 뒤로가기로 먼저 닫힙니다.\n"
              "5. 동시에 여러 빌드가 예전 APK를 덮어쓰지 않도록 최신 빌드만 유지합니다.\n"
              "6. 설치 충돌 방지를 위해 1.9.2는 별도 테스트 앱으로 설치됩니다.\n"
          )
          with ZipFile("downloads/TransportLogPro-HANIL-HD-ALZip.zip", "w", ZIP_DEFLATED) as z:
              z.write(apk, apk.name)
              z.writestr("설치안내.txt", message.encode("utf-8"))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/TransportLogPro-HANIL-HD.apk downloads/TransportLogPro-HANIL-HD-ALZip.zip
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish latest TEST Android APK [skip ci]"
            git push
          fi
