name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify QR waybill parsing
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/qr-ssangyong-fix.js
          node --check app/src/main/assets/qr-sampyo-ui-fix.js
          node --check app/src/main/assets/manual-quick-register-fix.js
          node --check app/src/main/assets/transport-edit-fix.js
          node tests/qr-waybill.test.cjs
          node tests/qr-ssangyong-fix.test.cjs
          node tests/qr-hanil-final.test.cjs
          node tests/qr-halla-port.test.cjs
          node tests/qr-spnature.test.cjs
          node tests/qr-sampyo-samcheok-current.test.cjs
          node tests/qr-sampyo-ui-fix.test.cjs
          node tests/client-registration.test.cjs
          node tests/quick-transport-save.test.cjs
          node tests/manual-quick-register.test.cjs
          node tests/direct-client-entry.test.cjs
          node tests/manual-product-entry.test.cjs
          node tests/transport-edit.test.cjs

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Build release AAB (unsigned)
        run: gradle :app:bundleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransportLogPro-HANIL-HD-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransportLogPro-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Publish Hanil HD APK and ALZip-compatible ZIP
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/TransportLogPro-HANIL-HD.apk
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          apk = Path("downloads/TransportLogPro-HANIL-HD.apk")
          message = (
              "운송일보 PRO QR 테스트 앱 (1.8.5)\n"
              "1. 운송내역 카드에 '수정' 버튼을 추가했습니다.\n"
              "2. 수정 버튼을 누르면 기존 거래처/제품명/중량/단가/상하차지/양회사/운송사/차량번호를 다시 불러옵니다.\n"
              "3. 수정 저장 시 새 운송건을 추가하지 않고 기존 운송내역을 그대로 업데이트합니다.\n"
              "4. 수정 중에는 '수정 취소' 버튼으로 원래 내역 화면으로 돌아갈 수 있습니다.\n"
              "5. 기존 QR 스캔, 거래처 직접 입력, 제품명 직접 입력, 빠른운송 저장 기능은 그대로 유지합니다.\n"
              "6. 기존 앱은 삭제하지 마세요. 이 앱은 별도 테스트 앱입니다.\n"
          )
          with ZipFile("downloads/TransportLogPro-HANIL-HD-ALZip.zip", "w", ZIP_DEFLATED) as z:
              z.write(apk, apk.name)
              z.writestr("설치안내.txt", message.encode("utf-8"))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/TransportLogPro-HANIL-HD.apk downloads/TransportLogPro-HANIL-HD-ALZip.zip
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish latest TEST Android APK [skip ci]"
            git push
          fi
