name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify QR waybill parsing
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/qr-ssangyong-fix.js
          node tests/qr-waybill.test.cjs
          node tests/qr-ssangyong-fix.test.cjs
          node tests/qr-hanil-final.test.cjs

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Build release AAB (unsigned)
        run: gradle :app:bundleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransportLogPro-HANIL-FINAL-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransportLogPro-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Publish Hanil FINAL APK and ALZip-compatible ZIP
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/TransportLogPro-HANIL-FINAL.apk
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          apk = Path("downloads/TransportLogPro-HANIL-FINAL.apk")
          message = (
              "운송일보 PRO 한일 영월 QR 최종 확인 앱 (1.6.3)\n"
              "1. 삼표와 쌍용 기능은 그대로 유지됩니다.\n"
              "2. 한일 영월 CB0010 QR을 인식하면 포틀랜드시멘트(1종), 실질량, 거래처, 상차지, 하차지를 자동 입력합니다.\n"
              "3. 등록 단가가 있으면 연결하고 없으면 단가만 확인하라는 안내를 표시합니다.\n"
              "4. 기존 앱은 삭제하지 마세요. 이 앱은 별도 테스트 앱입니다.\n"
          )
          with ZipFile("downloads/TransportLogPro-HANIL-FINAL-ALZip.zip", "w", ZIP_DEFLATED) as z:
              z.write(apk, apk.name)
              z.writestr("설치안내.txt", message.encode("utf-8"))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/TransportLogPro-HANIL-FINAL.apk downloads/TransportLogPro-HANIL-FINAL-ALZip.zip
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish latest TEST Android APK [skip ci]"
            git push
          fi
