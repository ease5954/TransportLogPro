name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Build release AAB (unsigned)
        run: gradle :app:bundleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransportLogPro-QR-SQUARE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransportLogPro-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Publish QR SQUARE APK and ALZip-compatible ZIP
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/TransportLogPro-QR-SQUARE.apk
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          apk = Path("downloads/TransportLogPro-QR-SQUARE.apk")
          message = (
              "운송일보 PRO 사각 QR 테스트앱 (1.5.3)\\n"
              "1. 휴대폰에서 ZIP 파일을 내 파일 또는 알집으로 압축 해제하세요.\\n"
              "2. 압축을 푼 TransportLogPro-QR-SQUARE.apk 파일을 눌러 설치하세요.\\n"
              "3. 카메라 권한을 허용하고 QR 스캔과 QR 사진 촬영/선택을 시험하세요.\\n"
              "4. 기존 운송일보 앱은 삭제하지 마세요. 데이터는 앱별로 별도 저장됩니다.\\n"
          )
          with ZipFile("downloads/TransportLogPro-QR-SQUARE-ALZip.zip", "w", ZIP_DEFLATED) as z:
              z.write(apk, apk.name)
              z.writestr("설치안내.txt", message.encode("utf-8"))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/TransportLogPro-QR-SQUARE.apk downloads/TransportLogPro-QR-SQUARE-ALZip.zip
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish latest TEST Android APK [skip ci]"
            git push
          fi
